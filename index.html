  <head>

    <link rel="preload" href="/fonts/bowlby-one-sc-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/genesis-campus-comic-events-portrait.webp" as="image" fetchpriority="high" media="(max-aspect-ratio: 3/4)" />
    <link rel="preload" href="/images/genesis-campus-comic-events.webp" as="image" fetchpriority="high" media="not all and (max-aspect-ratio: 3/4)" />
    <link rel="preload" href="/images/genesis-logo.webp" as="image" />
    <style>
      html.is-loading { overflow: hidden; }
      .loader { position: fixed; z-index: 200; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem; overflow: hidden; background: #087ed0 linear-gradient(135deg, #108fe2, #063a90); box-shadow: 0 8px 0 #111; }
      .loader.is-active { display: flex; }
      .loader::before { position: absolute; z-index: -1; top: 50%; left: 50%; width: 220vmax; aspect-ratio: 1; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(#fff2 0deg 3deg, transparent 3deg 12deg); content: ''; animation: loader-spin 40s linear infinite; }
      .loader::after { position: absolute; z-index: -1; inset: 0; background-image: radial-gradient(#ffffff38 1px, transparent 1.5px); background-size: 11px 11px; content: ''; }
      .loader__logo { display: block; width: min(72vw, 420px); height: auto; filter: drop-shadow(5px 6px 0 #111); animation: loader-slam .8s cubic-bezier(.16, 1, .3, 1) both, loader-float 2.8s ease-in-out .8s infinite alternate; }
      .loader__bar { width: min(64vw, 300px); height: 1.4rem; padding: 3px; background: #fff; border: 4px solid #111; box-shadow: 6px 6px 0 #111; transform: rotate(-2deg); animation: loader-rise .6s cubic-bezier(.22, 1, .36, 1) .25s both; }
      .loader__fill { display: block; height: 100%; background: #ffdc22 repeating-linear-gradient(-45deg, transparent 0 8px, #0000001a 8px 16px); transform: scaleX(0); transform-origin: left; transition: transform 1.2s cubic-bezier(.22, 1, .36, 1); }
      .loader.is-running .loader__fill { transform: scaleX(.88); }
      .loader.is-done .loader__fill { transform: scaleX(1); transition-duration: .3s; }
      .loader__text { margin: -.8rem 0 0; color: #fff; font: 400 .9rem/1 'Bowlby One SC', 'Arial Black', sans-serif; letter-spacing: .2em; text-shadow: 2px 2px 0 #111; animation: loader-rise .6s cubic-bezier(.22, 1, .36, 1) .35s both; }
      .loader.is-done { animation: loader-out .7s cubic-bezier(.7, 0, .84, 0) .3s forwards; }
      @keyframes loader-spin { to { rotate: 1turn; } }
      @keyframes loader-slam { from { opacity: 0; scale: 1.4; filter: drop-shadow(5px 6px 0 #111) blur(10px); } }
      @keyframes loader-float { to { translate: 0 -.5rem; } }
      @keyframes loader-rise { from { opacity: 0; translate: 0 1rem; } }
      @keyframes loader-out { to { translate: 0 calc(-100% - 8px); } }
      @media (prefers-reduced-motion: reduce) { .loader, .loader *, .loader::before { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" aria-hidden="true">
      <img class="loader__logo" src="/images/genesis-logo.webp" width="480" height="189" alt="" fetchpriority="high" />
      <div class="loader__bar"><span class="loader__fill"></span></div>
      <p class="loader__text">Loading the fest…</p>
    </div>
    <script>
      (() => {
        const root = document.documentElement
        const loader = document.getElementById('loader')
        const navigation = performance.getEntriesByType('navigation')[0]
        const path = window.location.pathname.replace(/\/+$/, '') || '/'
        const isHomePage = (path === '/' || path === '/index.html') && new URLSearchParams(window.location.search).get('page') !== 'explore'
        if (!isHomePage || navigation?.type === 'back_forward') {
          loader?.remove()
          return
        }
        loader.classList.add('is-active')
        root.classList.add('is-loading')
        requestAnimationFrame(() => requestAnimationFrame(() => loader.classList.add('is-running')))
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
        const loaded = new Promise((resolve) => {
          if (document.readyState === 'complete') resolve()
          else addEventListener('load', resolve, { once: true })
        })
        Promise.race([Promise.all([loaded, wait(1200)]), wait(6000)]).then(() => {
          loader.classList.add('is-done')
          setTimeout(() => root.classList.remove('is-loading'), 500)
          setTimeout(() => loader.remove(), 1100)
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
